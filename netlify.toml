[build]
  command = "npm run site:build"
  publish = "site"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[build.environment]
  NODE_VERSION = "20"
  # Netlify's secret scanning reads repo code before publishing. These paths are
  # never part of the deployed site and only ever hold placeholders.
  SECRETS_SCAN_OMIT_PATHS = ".env.example,certs/,data/,hide/"
  # DB_HOST / DB_PORT / DB_NAME are not secrets - their values (a public AWS
  # endpoint, the port 4000, and the database name) legitimately appear
  # throughout the code and docs. Only DB_PASS stays scanned.
  SECRETS_SCAN_OMIT_KEYS = "DB_HOST,DB_PORT,DB_NAME"

# Explicit page routes, so the site does not depend on pretty-URL behaviour.
[[redirects]]
  from = "/order"
  to = "/order.html"
  status = 200

[[redirects]]
  from = "/track"
  to = "/track.html"
  status = 200
