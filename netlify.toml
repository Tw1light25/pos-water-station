[build]
  command = "npm run site:build"
  publish = "site"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[build.environment]
  NODE_VERSION = "20"

# Explicit page routes, so the site does not depend on pretty-URL behaviour.
[[redirects]]
  from = "/order"
  to = "/order.html"
  status = 200

[[redirects]]
  from = "/track"
  to = "/track.html"
  status = 200
